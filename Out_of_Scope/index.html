<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Harta IP-uri - Dashboard DNS</title>
  <!-- Include Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="map-container">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
  center: [20, 0],  // centrul lumii
  zoom: 2,          // zoom inițial
  minZoom: 2,       // nu poate da mai aproape de lume
  maxZoom: 5,       // limitează cât se apropie
  worldCopyJump:true 
});

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap contributors& Carto',
      subdomains:'abcd',
      maxZoom:19,
      noWrap:false,
    }).addTo(map);

    // Exemplu IP-uri statice
    const ipData = [
      { ip: "8.8.8.8", lat: 37.751, lon: -97.822, desc: "Google DNS" },
      { ip: "1.1.1.1", lat: -33.8688, lon: 151.2093, desc: "Cloudflare DNS" },
      { ip: "89.136.22.10", lat: 44.4268, lon: 26.1025, desc: "Romania IP" },
    ];

    ipData.forEach(entry => {
      const marker = L.marker([entry.lat, entry.lon]).addTo(map);
      marker.bindPopup(`<b>${entry.ip}</b><br>${entry.desc}`);
    });

    async function loadIPs() {
  try {
    const response = await fetch('http://localhost:8000/api/ips');
    const ipData = await response.json();

    ipData.forEach(entry => {
      const marker = L.marker([entry.lat, entry.lon]).addTo(map);
      marker.bindPopup(`<b>${entry.ip}</b><br>${entry.desc}`);
    });
  } catch (error) {
    console.error('Eroare la încărcarea IP-urilor:', error);
  }
}

loadIPs();

  </script>
</body>
</html>
