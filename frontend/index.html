<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Dashboard Retro-Tech</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-mono h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="nav-bar flex justify-between items-center p-4">
    <div class="flex items-center gap-6">
      <span class="text-2xl font-bold text-cyan-400">DNS Dashboard</span>
      <ul class="flex gap-4">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="harta.html" class="nav-link">Harta</a></li>
        <li><a href="#" class="nav-link">Conexiuni</a></li>
        <li><a href="#" class="nav-link">Statistici</a></li>
      </ul>
    </div>
  </nav>

  <div class="flex flex-1 overflow-hidden">

    <!-- MAIN CONTENT -->
    <div class="flex-1 p-6 overflow-auto">

      <!-- BAR PENTRU LINK + BUTON -->
      <div class="flex gap-4 mb-6">
        <input type="text" placeholder="Introdu link..." class="input-bar flex-1 p-3 rounded">
        <button class="btn-check px-6 py-2 rounded">Check</button>
      </div>

      <!-- CONEXIUNE TEMPLATE -->
      <div class="card-template p-6 rounded shadow">
        <h2 class="text-2xl font-bold mb-4 text-cyan-300">Date conexiune</h2>
        <p>Aici se vor afișa datele conexiunii (template momentan).</p>

        <div class="dns-info mt-4 p-4 rounded">
          <div class="flex justify-between"><span>IP:</span><span>192.168.1.1</span></div>
          <div class="flex justify-between"><span>Status:</span><span class="text-green-400 font-bold">Connected</span></div>
          <div class="flex justify-between"><span>Pachete trimise:</span><span>120</span></div>
        </div>
      </div>

    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="w-80 p-4 overflow-auto sidebar">
      <h3 class="font-bold text-lg mb-4 text-cyan-300">Pachete DNS</h3>
      <div class="space-y-3">
        <div class="packet-card">DNS Packet 1: ...</div>
        <div class="packet-card">DNS Packet 2: ...</div>
        <div class="packet-card">DNS Packet 3: ...</div>
        <div class="packet-card">DNS Packet 4: ...</div>
        <div class="packet-card">DNS Packet 5: ...</div>
      </div>
    </div>

  </div>

</body>
</html>
