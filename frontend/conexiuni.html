<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pachete DNS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white font-mono h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="nav-bar flex justify-between items-center p-4">
  <div class="flex items-center gap-6">
    <!-- LOGO + TITLU -->
    <div class="flex items-center gap-3">
      <img src="images/logo.png" alt="Logo DNS" class="w-10 h-10">
      <span class="text-2xl font-bold text-cyan-400">Phishing At Bay</span>
    </div>

    <!-- MENIU -->
    <ul class="flex gap-4">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="harta.html" class="nav-link">Harta</a></li>
      <li><a href="conexiuni.html" class="nav-link">Conexiuni</a></li>
      <li><a href="statistici.html" class="nav-link">Statistici</a></li>
    </ul>
  </div>
</nav>


  <!-- Header -->
  <header class="text-center py-4 bg-gray-850 border-b border-cyan-400 shadow-md">
    <h1 class="text-3xl font-bold text-cyan-300 tracking-wide">Pachete DNS</h1>
    <p class="text-gray-400 text-sm mt-1">Flux de pachete DNS capturate în timp real</p>
  </header>

  <!-- Conținutul principal -->
  <main class="flex-1 overflow-y-auto p-6 sidebar">
    <div id="packetContainer" class="space-y-3">
      <!-- Pachetele vor apărea aici -->
    </div>
  </main>

  <script>
    // Simulare pachete DNS primite (va fi înlocuit cu backend real)
    const packetContainer = document.getElementById('packetContainer');

    function addPacket(data) {
      const card = document.createElement('div');
      card.className = 'packet-card';
      card.textContent = data;
      packetContainer.prepend(card); // cel mai recent sus
    }

    // Test: adaugă un pachet nou la fiecare 2 secunde
    setInterval(() => {
      const time = new Date().toLocaleTimeString();
      addPacket(`Pachet DNS primit la ${time}: query pentru "example.com"`);
    }, 2000);
  </script>

</body>
</html>
