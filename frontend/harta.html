<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harta DNS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body class="bg-gray-900 text-white font-mono h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="nav-bar flex justify-between items-center p-4">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="Logo DNS" class="logo">
        <span class="site-title">Phishing At Bay</span>
      </div>
      <ul class="flex gap-4">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="harta.html" class="nav-link">Harta</a></li>
        <li><a href="conexiuni.html" class="nav-link">Conexiuni</a></li>
        <li><a href="statistici.html" class="nav-link">Statistici</a></li>
      </ul>
    </div>
  </nav>

  <!-- Titlu principal -->
  <header class="header">
    <h1 class="header-title">Harta DNS</h1>
    <p class="header-subtitle">Vizualizare globală a serverelor DNS și IP-urilor active</p>
  </header>

  <!-- Container hartă -->
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      minZoom: 2,
      maxZoom: 5,
      worldCopyJump: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap & Carto',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const ipData = [
      { ip: "8.8.8.8", lat: 37.751, lon: -97.822, desc: "Google DNS" },
      { ip: "1.1.1.1", lat: -33.8688, lon: 151.2093, desc: "Cloudflare DNS" },
      { ip: "89.136.22.10", lat: 44.4268, lon: 26.1025, desc: "Romania IP" },
    ];

    ipData.forEach(entry => {
      L.marker([entry.lat, entry.lon]).addTo(map)
        .bindPopup(`<b>${entry.ip}</b><br>${entry.desc}`);
    });

    // Conexiuni cu status
    const connections = [
      { from: ipData[0], to: ipData[1], status: 'safe' },
      { from: ipData[1], to: ipData[2], status: 'medium' },
      { from: ipData[0], to: ipData[2], status: 'danger' }
    ];

    function getColor(status) {
      switch(status) {
        case 'safe': return 'green';
        case 'medium': return 'yellow';
        case 'danger': return 'red';
        default: return 'white';
      }
    }

    connections.forEach(conn => {
      const polyline = L.polyline(
        [[conn.from.lat, conn.from.lon], [conn.to.lat, conn.to.lon]],
        { color: getColor(conn.status), weight: 3, opacity: 0.8, dashArray: '10,10' }
      ).addTo(map);

      // animație dash
      let offset = 0;
      setInterval(() => {
        offset = (offset - 1) % 20;
        polyline.setStyle({ dashOffset: offset });
      }, 50);
    });

    async function loadIPs() {
      try {
        const response = await fetch('http://localhost:8000/api/ips');
        const data = await response.json();
        data.forEach(entry => {
          L.marker([entry.lat, entry.lon]).addTo(map)
            .bindPopup(`<b>${entry.ip}</b><br>${entry.desc}`);
        });
      } catch (error) {
        console.error('Eroare la încărcarea IP-urilor:', error);
      }
    }

    loadIPs();
  </script>

</body>
</html>
