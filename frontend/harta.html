<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harta DNS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 1; /* Ocupă tot spațiul rămas pe verticală */
      width: 100%;
    }
  </style>
</head>
<body class="bg-gray-900 text-white">

  <!-- Navbar -->
  <nav class="flex justify-between items-center p-4 bg-gray-800 border-b border-cyan-400">
    <div class="flex items-center gap-6">
      <span class="text-2xl font-bold text-cyan-400">DNS Dashboard</span>
      <ul class="flex gap-4">
        <li><a href="index.html" class="hover:text-cyan-300">Home</a></li>
        <li><a href="harta.html" class="hover:text-cyan-300 font-bold text-cyan-400">Harta</a></li>
        <li><a href="conexiuni.html" class="hover:text-cyan-300">Conexiuni</a></li>
        <li><a href="#" class="hover:text-cyan-300">Statistici</a></li>
      </ul>
    </div>
  </nav>

  <!-- Titlu principal -->
  <header class="text-center py-4 bg-gray-850 border-b border-cyan-400 shadow-md">
    <h1 class="text-3xl font-bold text-cyan-300 tracking-wide">Harta DNS</h1>
    <p class="text-gray-400 text-sm mt-1">Vizualizare globală a serverelor DNS și IP-urilor active</p>
  </header>

  <!-- Container hartă -->
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      minZoom: 2,
      maxZoom: 5,
      worldCopyJump: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap & Carto',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const ipData = [
      { ip: "8.8.8.8", lat: 37.751, lon: -97.822, desc: "Google DNS" },
      { ip: "1.1.1.1", lat: -33.8688, lon: 151.2093, desc: "Cloudflare DNS" },
      { ip: "89.136.22.10", lat: 44.4268, lon: 26.1025, desc: "Romania IP" },
    ];

    ipData.forEach(entry => {
      L.marker([entry.lat, entry.lon]).addTo(map)
        .bindPopup(`<b>${entry.ip}</b><br>${entry.desc}`);
    });

    async function loadIPs() {
      try {
        const response = await fetch('http://localhost:8000/api/ips');
        const data = await response.json();
        data.forEach(entry => {
          L.marker([entry.lat, entry.lon]).addTo(map)
            .bindPopup(`<b>${entry.ip}</b><br>${entry.desc}`);
        });
      } catch (error) {
        console.error('Eroare la încărcarea IP-urilor:', error);
      }
    }

    loadIPs();
  </script>

</body>
</html>
