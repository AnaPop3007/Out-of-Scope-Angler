<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pachete DNS — Liste periculoase</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white font-mono h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="nav-bar flex justify-between items-center p-4">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="Logo DNS" class="logo">
        <span class="site-title">Phishing At Bay</span>
      </div>
      <ul class="menu flex gap-4">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="harta.html" class="nav-link">Harta</a></li>
        <li><a href="conexiuni.html" class="nav-link">Conexiuni</a></li>
        <li><a href="statistici.html" class="nav-link">Statistici</a></li>
      </ul>
    </div>
  </nav>

  <!-- Header + Buton -->
  <header class="header text-center">
    <div class="header-content max-w-5xl mx-auto">
      <div>
        <h1 class="header-title">DNS Periculoase</h1>
        <p class="header-subtitle">Lista DNS periculoase capturate</p>
      </div>
      <div>
        <button id="showBadBtn" class="btn-check">Afișează DNS periculoase</button>
      </div>
    </div>
  </header>

  <!-- Lista DNS periculoase (ascunsă inițial) -->
  <main class="main-content flex-1 overflow-y-auto p-6">
    <div id="badList" class="bad-list max-w-5xl mx-auto hidden">
      <!-- elementele vor fi populate aici -->
    </div>
  </main>

  <script>
    const badList = document.getElementById('badList');
    const showBadBtn = document.getElementById('showBadBtn');

    const badDNS = [
      { domain: "bad-example.com", reason: "phishing", first_seen: "2025-06-01" },
      { domain: "malicious-redirect.net", reason: "malware", first_seen: "2025-07-12" },
      { domain: "typo-g00gle.xyz", reason: "typosquatting", first_seen: "2025-08-08" },
      { domain: "sneaky-login.info", reason: "credential-harvest", first_seen: "2025-09-02" }
    ];

    function renderBadList(items) {
      badList.innerHTML = '';
      items.forEach(it => {
        const div = document.createElement('div');
        div.className = 'packet-card';
        div.innerHTML = `
          <div class="packet-header">
            <div class="packet-domain">${it.domain}</div>
            <div class="packet-date">${it.first_seen || '-'}</div>
          </div>
          <div class="packet-reason">Motiv: ${it.reason}</div>
        `;
        badList.appendChild(div);
      });
    }

    showBadBtn.addEventListener('click', () => {
      if (badList.classList.contains('hidden')) {
        renderBadList(badDNS);
        badList.classList.remove('hidden');
        showBadBtn.textContent = 'Ascunde DNS periculoase';
      } else {
        badList.classList.add('hidden');
        showBadBtn.textContent = 'Afișează DNS periculoase';
      }
    });
  </script>

</body>
</html>
