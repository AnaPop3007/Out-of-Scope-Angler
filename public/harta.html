<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harta DNS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body class="bg-gray-900 text-white font-mono h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="nav-bar flex justify-between items-center p-4">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="Logo DNS" class="logo">
        <span class="site-title">Phishing At Bay</span>
      </div>
      <ul class="flex gap-4">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="harta.html" class="nav-link">Harta</a></li>
        <li><a href="conexiuni.html" class="nav-link">Conexiuni</a></li>
        <li><a href="statistici.html" class="nav-link">Statistici</a></li>
      </ul>
    </div>
  </nav>

  <!-- Titlu principal -->
  <header class="header">
    <h1 class="header-title">Harta DNS</h1>
    <p class="header-subtitle">Vizualizare globală a serverelor DNS și IP-urilor active</p>
  </header>

  <!-- Container hartă -->
  <div id="map" class="flex-1"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      minZoom: 2,
      maxZoom: 5,
      worldCopyJump: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap & Carto',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Nod fix România
    const romania = { ip: "89.136.22.10", lat: 44.4268, lon: 26.1025, desc: "Romania DNS" };
    L.marker([romania.lat, romania.lon]).addTo(map)
      .bindPopup(`<b>${romania.ip}</b><br>${romania.desc}`);

    // Noduri DNS fixe (aproximativ pe continente)
    const dnsServers = [
      { ip: "8.22.51.8", desc: "Google DNS", status: "safe", lat: 37.751, lon: -97.822 },       // SUA
      { ip: "12.45.112.200", desc: "Cloudflare DNS", status: "safe", lat: -30.8688, lon: 145.2093 }, // Australia
      { ip: "208.67.222.222", desc: "OpenDNS", status: "medium", lat: 45.7100, lon: -76.0060 }, // NY, SUA
      { ip: "9.23.112.212", desc: "Quad9 DNS", status: "danger", lat: 48.8566, lon: 2.3522 },       // Paris, Europa
      { ip: "77.88.8.8", desc: "Yandex DNS", status: "medium", lat: 55.7558, lon: 37.6173 },  // Moscova
    ];

    const markers = [];
    const lines = [];

    function getColor(status) {
      switch(status) {
        case 'safe': return 'green';
        case 'medium': return 'yellow';
        case 'danger': return 'red';
        default: return 'white';
      }
    }

    // Adaugă noduri pe hartă și creează linii către România
    dnsServers.forEach(server => {
      const marker = L.marker([server.lat, server.lon]).addTo(map)
        .bindPopup(`<b>${server.ip}</b><br>${server.desc}`);
      markers.push(marker);

      const line = L.polyline([[romania.lat, romania.lon], [server.lat, server.lon]], {
        color: getColor(server.status),
        weight: 3,
        opacity: 0.8,
        dashArray: '10,10'
      }).addTo(map);

      // animație linie
      let offset = 0;
      setInterval(() => {
        offset = (offset - 1) % 20;
        line.setStyle({ dashOffset: offset });
      }, 50);

      lines.push(line);
    });

  </script>
</body>
</html>
