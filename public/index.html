<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Dashboard Retro-Tech</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-mono h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="nav-bar flex justify-between items-center p-4">
    <div class="flex items-center gap-6">
      <!-- LOGO + TITLU -->
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="Logo DNS" class="w-10 h-10">
        <span class="text-2xl font-bold text-cyan-400">Phishing At Bay</span>
      </div>

      <!-- MENIU -->
      <ul class="flex gap-4">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="harta.html" class="nav-link">Harta</a></li>
        <li><a href="conexiuni.html" class="nav-link">Conexiuni</a></li>
        <li><a href="statistici.html" class="nav-link">Statistici</a></li>
      </ul>
    </div>
  </nav>

  <div class="flex flex-1 overflow-hidden">
    
    <!-- MAIN CONTENT -->
    <div class="flex-1 p-6 overflow-auto">
      <!-- BAR PENTRU LINK + BUTON -->
      <div class="flex gap-4 mb-6">
        <input id="linkInput" type="text" placeholder="Introdu link..." class="input-bar flex-1 p-3 rounded">
        <button id="checkBtn" class="btn-check px-6 py-2 rounded">Check</button>
      </div>

      <!-- ZONA CONEXIUNI -->
      <div id="connectionsArea" class="space-y-4">
        <!-- cardurile se vor adăuga aici -->
      </div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="w-80 p-4 overflow-auto sidebar">
      <h3 class="font-bold text-lg mb-4 text-cyan-300">Pachete DNS</h3>
      <div id="packetArea" class="space-y-3">
        <!-- Pachetele DNS vor fi adăugate automat aici -->
      </div>
    </div>

  </div>

  <script>
    const input = document.getElementById('linkInput');
    const button = document.getElementById('checkBtn');
    const area = document.getElementById('connectionsArea');
    const packetArea = document.getElementById('packetArea');

    async function addConnection() {
  const link = input.value.trim();
  if (!link) return;

  // 1. Trimite link-ul la Node.js (asta e corect)
  const response = await fetch("/api/process-link", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ link })
  });

  // 2. Primește JSON-ul complex (ex: { status: 'Suspicious', risk_score: 55, ... })
  const data = await response.json();

  // 3. Creează noul card (AICI ESTE SCHIMBAREA)
  
  // Determină culoarea în funcție de status
  let statusColor = 'text-green-400'; // Default: Safe
  let borderColor = 'border-green-700';
  if (data.status === 'Suspicious') {
    statusColor = 'text-yellow-400';
    borderColor = 'border-yellow-700';
  } else if (data.status === 'DANGEROUS') {
    statusColor = 'text-red-500';
    borderColor = 'border-red-700';
  }

  const card = document.createElement('div');
  card.className = `card-template p-6 rounded shadow bg-gray-800 border ${borderColor}`; // Am adăugat border-ul dinamic
  
  // Afișăm noile date: 'data.status' și 'data.risk_score'
  card.innerHTML = `
    <h2 class="text-xl font-bold mb-2 text-cyan-300">Rezultat Analiză</h2>
    <p class="text-sm mb-2">Link: <span class="text-cyan-400">${data.url_testat}</span></p>
    <p class="text-lg mb-2">Status: <span class="font-bold ${statusColor}">${data.status}</span></p>
    <p class="text-sm">Scor Risc: <span class="font-bold text-white">${data.risk_score}</span></p>
    
        ${data.alerts_triggered && data.alerts_triggered.length > 0 ?
      `<div class="mt-3 pt-3 border-t border-gray-700">
        <h4 class="text-sm font-bold text-gray-400 mb-1">Alerte declanșate:</h4>
        <ul class="list-disc list-inside text-xs text-gray-400">
          ${data.alerts_triggered.map(alert => `<li>${alert}</li>`).join('')}
        </ul>
      </div>`
      : ''
    }
  `;
  
  area.prepend(card);
  input.value = '';
}
    // Apăsare pe buton
    button.addEventListener('click', addConnection);

    // Enter în input
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addConnection();
      }
    });

    // ---- Simulare pachete DNS ----
    const dnsPackets = [
      "DNS Query: google.com → 82.18.222.121",
      "DNS Response: 142.250.74.14",
      "DNS Query: cloudflare.com → 62.52.32.121",
      "DNS Query: openai.com → 72.71.32.111",
      "DNS Response: 104.22.3.243",
      "DNS Query: microbsoft.net → 10.91.82.73",
      "DNS Query: reddit.com → 42.33.58.1",
      "DNS Response: 151.101.1.140",
    ];

    let packetIndex = 0;

    function addPacket() {
      const packet = document.createElement('div');
      packet.className = 'packet-card';
      packet.textContent = dnsPackets[packetIndex % dnsPackets.length];
      packetArea.prepend(packet); // cel mai nou pachet sus
      packetIndex++;

      // menține max 20 pachete
      if (packetArea.children.length > 20) {
        packetArea.removeChild(packetArea.lastChild);
      }
    }

    // Adaugă un pachet la fiecare 5 secunde
    setInterval(addPacket, 5000);
  </script>
</body>
</html>
